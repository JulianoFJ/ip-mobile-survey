name: panoramax-br-v0
description: 'Panoramas 360° equirretangulares de vias urbanas brasileiras, com postes, braços e luminárias visíveis. Primeira
  avaliação qualitativa de detectores zero-shot (issue #15). Sem rótulos.'
source: Panoramax (https://panoramax.xyz), API STAC pública, sem autenticação
license: CC-BY-SA-4.0
attribution: Imagens © contribuidores do Panoramax (autores por item), licença CC BY-SA 4.0
retrieved: '2026-11-21'
local_dir: data/golden/panoramax-br-v0
notes:
- A maioria (GoPro Max, autor Túllio) tem uma faixa com logotipo "MUITO ALÉM DAS FRONTEIRAS" no nadir, abaixo de cerca de
  -60°, além do capô do carro. A fileira do horizonte e a inclinada (+35°) não são afetadas.
- As imagens não têm rótulos. Servem para avaliação visual e para criar rótulos depois.
