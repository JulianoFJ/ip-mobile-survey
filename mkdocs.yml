site_name: ipsurvey
docs_dir: docs
theme:
  name: material
  language: pt-BR
  features: [navigation.sections, content.code.copy]
markdown_extensions:
  - tables
  - admonition
  - toc: { permalink: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options: { docstring_style: google }
nav:
  - Início: index.md
  - Especificação: especificacao.md
  - Arquitetura:
      - Visão geral: architecture/overview.md
      - Contratos de dados: architecture/data-contracts.md
      - Pipeline: architecture/pipeline.md
      - Planilha de inspeção: architecture/inspection-sheet.md
  - ADRs:
      - Template: adr/0000-template.md
      - 0001 Monorepo uv: adr/0001-monorepo-python-uv.md
      - 0002 Prefect: adr/0002-prefect-orquestracao.md
      - 0003 Hexagonal: adr/0003-arquitetura-hexagonal.md
      - 0004 Detector Apache: adr/0004-detector-apache.md
      - 0005 CRS: adr/0005-crs.md
      - 0006 Inspeção única: adr/0006-escopo-inspecao-unica.md
      - 0007 Web na pilha do Ignis: adr/0007-web-pilha-do-ignis.md
      - 0008 Segmentação OneFormer: adr/0008-segmentacao-chao-oneformer.md
  - Algoritmos:
      - Vistas planas 360°: algorithms/perspective-views.md
      - Detecção em ângulos: algorithms/angular-detection.md
      - Malha NBR 5101: algorithms/nbr5101-grid.md
      - Fusão de fontes: algorithms/fusao-fontes.md
      - Larguras da via: algorithms/larguras-da-via.md
  - Bases de dados: datasets.md
