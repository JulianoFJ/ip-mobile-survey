# Servidor de teste do módulo de inspeção.
# Escuta SÓ em 127.0.0.1:3100: o acesso de fora passa pelo Caddy do servidor
# (bloco em deploy/Caddyfile.inspecao), que cuida do HTTPS e da senha.
name: ipsurvey
services:
  web:
    build: ../web
    image: ipsurvey-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/inspecao').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
