[importlinter]
root_package = ipsurvey

[importlinter:contract:domain-pure]
name = Domínio não depende de infraestrutura
type = forbidden
source_modules =
    ipsurvey.domain
forbidden_modules =
    ipsurvey.application
    ipsurvey.adapters
    ipsurvey.flows
    ipsurvey.api
    ipsurvey.cli
    ipsurvey.bootstrap
    ipsurvey.settings

[importlinter:contract:application-ports-only]
name = Aplicação usa só portas, nunca adaptadores
type = forbidden
source_modules =
    ipsurvey.application
forbidden_modules =
    ipsurvey.adapters
    ipsurvey.flows
    ipsurvey.api
    ipsurvey.cli
    ipsurvey.bootstrap

[importlinter:contract:layers]
name = Camadas hexagonais (bootstrap é a raiz de composição usada pelas entradas)
type = layers
layers =
    ipsurvey.api | ipsurvey.cli | ipsurvey.flows
    ipsurvey.bootstrap
    ipsurvey.adapters
    ipsurvey.application
    ipsurvey.domain

[importlinter:contract:entrypoints-via-bootstrap]
name = Entradas obtêm adaptadores só via bootstrap
type = forbidden
source_modules =
    ipsurvey.api
    ipsurvey.cli
    ipsurvey.flows
forbidden_modules =
    ipsurvey.adapters
# Via bootstrap é o caminho esperado; só o import direto é proibido.
allow_indirect_imports = True
