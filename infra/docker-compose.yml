name: ipsurvey

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${IPS_DB_NAME:-ipsurvey}
      POSTGRES_USER: ${IPS_DB_USER:-ipsurvey}
      POSTGRES_PASSWORD: ${IPS_DB_PASSWORD:-ipsurvey}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IPS_DB_USER:-ipsurvey}"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${IPS_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${IPS_S3_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASS} &&
      mc mb --ignore-existing --with-lock local/${IPS_S3_BUCKET:-ipsurvey} &&
      mc version enable local/${IPS_S3_BUCKET:-ipsurvey}
      "
    environment:
      MINIO_USER: ${IPS_S3_ACCESS_KEY:-minioadmin}
      MINIO_PASS: ${IPS_S3_SECRET_KEY:-minioadmin}

  prefect:
    image: prefecthq/prefect:3-python3.12
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports: ["4200:4200"]
    volumes: [prefectdata:/root/.prefect]

volumes:
  pgdata:
  miniodata:
  prefectdata:
